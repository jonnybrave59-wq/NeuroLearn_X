services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: neurolearnx
      POSTGRES_USER: neurolearnx
      POSTGRES_PASSWORD: neurolearnx-dev
    ports:
      - "5432:5432"
    volumes:
      - neurolearnx_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurolearnx -d neurolearnx"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  neurolearnx_postgres:

