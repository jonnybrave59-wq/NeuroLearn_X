databases:
  - name: neurolearn-x-postgres
    plan: basic-256mb
    region: singapore
    databaseName: neurolearnx
    user: neurolearnx
    postgresMajorVersion: "18"
    diskSizeGB: 5
    storageAutoscalingEnabled: true

services:
  - type: web
    name: neurolearn-x
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/ready
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: neurolearn-x-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PRODUCTION_TEACHER_PASSWORD
        sync: false
      - key: PRODUCTION_DEMO_STUDENT_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: COOKIE_SAMESITE
        value: none
      - key: CAPACITOR_ORIGINS
        value: https://localhost
      - key: CREATE_TABLES_ON_STARTUP
        value: "0"
      - key: SEED_DEMO_ON_STARTUP
        value: "0"
      - key: SEED_DEMO_IF_EMPTY
        value: "0"
      - key: LOG_LEVEL
        value: INFO
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: "10"
      - key: DB_STATEMENT_TIMEOUT_MS
        value: "30000"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: DB_POOL_RECYCLE_SECONDS
        value: "300"
      - key: DB_POOL_TIMEOUT_SECONDS
        value: "15"
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: MAX_EXTRACTED_TEXT_CHARS
        value: "250000"
      - key: UPLOAD_PROCESSING_TIMEOUT_SECONDS
        value: "45"
      - key: AI_PROVIDER
        value: openai-compatible
      - key: AI_MODEL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_REQUEST_TIMEOUT_SECONDS
        value: "90"
      - key: UVICORN_LIMIT_CONCURRENCY
        value: "100"
      - key: UVICORN_TIMEOUT_KEEP_ALIVE_SECONDS
        value: "5"
      - key: UVICORN_GRACEFUL_SHUTDOWN_SECONDS
        value: "30"
