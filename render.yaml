services:
  - type: web
    name: neurolearn-x
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/ready
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: PUBLIC_APP_URL
        value: https://neurolearn-x-staging.vercel.app
      - key: FRONTEND_ORIGIN
        value: https://neurolearn-x-staging.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://neurolearn-x-staging.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: learning-materials
      - key: SUPABASE_STORAGE_TIMEOUT_SECONDS
        value: "30"
      - key: SECRET_KEY
        generateValue: true
      - key: PRODUCTION_TEACHER_PASSWORD
        sync: false
      - key: PRODUCTION_DEMO_STUDENT_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: COOKIE_SAMESITE
        value: none
      - key: CAPACITOR_ORIGINS
        value: https://localhost
      - key: CREATE_TABLES_ON_STARTUP
        value: "0"
      - key: SEED_DEMO_ON_STARTUP
        value: "0"
      - key: SEED_DEMO_IF_EMPTY
        value: "0"
      - key: LOG_LEVEL
        value: INFO
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: "10"
      - key: DB_STATEMENT_TIMEOUT_MS
        value: "30000"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: DB_POOL_RECYCLE_SECONDS
        value: "300"
      - key: DB_POOL_TIMEOUT_SECONDS
        value: "15"
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: MAX_EXTRACTED_TEXT_CHARS
        value: "250000"
      - key: UPLOAD_PROCESSING_TIMEOUT_SECONDS
        value: "45"
      - key: UVICORN_LIMIT_CONCURRENCY
        value: "100"
      - key: UVICORN_TIMEOUT_KEEP_ALIVE_SECONDS
        value: "5"
      - key: UVICORN_GRACEFUL_SHUTDOWN_SECONDS
        value: "30"
