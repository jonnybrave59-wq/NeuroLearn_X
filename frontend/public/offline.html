<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#071b34" />
    <title>NeuroLearn-X is offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #071b34; color: white; font: 16px/1.6 system-ui, sans-serif; }
      main { max-width: 520px; padding: 36px; border: 1px solid #1d4968; border-radius: 24px; background: #0c2948; }
      h1 { margin: 0 0 12px; font-size: 30px; line-height: 1.15; }
      p { color: #cbd5e1; }
      a, button { display: inline-block; margin: 14px 8px 0 0; border: 0; border-radius: 12px; padding: 12px 18px; background: #22d3ee; color: #071b34; font-weight: 800; text-decoration: none; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Previously opened NeuroLearn-X lessons and your latest pathway may still be available in the installed app.</p>
      <p><strong>You appear to be offline. Check your connection and try again.</strong></p>
      <button id="retry" type="button">Try again</button>
      <a href="/#/">Open cached app</a>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
